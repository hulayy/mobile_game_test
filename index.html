<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Glyph Grid</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-cell">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-cell">
          <span class="hud-label">BEST</span>
          <span id="best" class="hud-value">0</span>
        </div>
        <div class="hud-cell">
          <span class="hud-label">COMBO</span>
          <span id="combo" class="hud-value">x1</span>
        </div>
      </header>
      <canvas id="board"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h1 class="overlay-title">SYSTEM HALT</h1>
          <p class="overlay-sub">No valid placements remain.</p>
          <p class="overlay-score"><span id="final-score">0</span></p>
          <button id="restart" class="btn">REBOOT</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
