<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffb6d5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Sugar Drop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-cell">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-cell hud-best">
          <span class="hud-label">BEST</span>
          <span id="best" class="hud-value">0</span>
        </div>
        <div class="hud-cell hud-combo">
          <span class="hud-label">COMBO</span>
          <span id="combo" class="hud-value">x1</span>
        </div>
      </header>
      <div id="level-strip" class="level-strip">
        <span id="level-emoji" class="level-emoji">&#127853;</span>
        <span id="level-name" class="level-name">CANDY LAND</span>
        <span class="level-num">LV<span id="level-num">1</span></span>
      </div>
      <div class="audio-controls">
        <button id="toggle-music" class="audio-btn" aria-label="Toggle music" title="Music">&#9835;</button>
        <button id="toggle-sfx" class="audio-btn" aria-label="Toggle sound effects" title="Sound effects">&#128266;</button>
      </div>
      <canvas id="board"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="overlay-emoji">&#127853;</div>
          <h1 class="overlay-title">SWEET END!</h1>
          <p class="overlay-sub">No more room for candies.</p>
          <p class="overlay-score"><span id="final-score">0</span></p>
          <button id="restart" class="btn">PLAY AGAIN</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
